[terminal]
vt = 1

[default_session]
# Path fixed up for the install prefix by `make install-greeter`; cursor matches niri and environment.d/60-thomas-shell.conf.
# systemd-cat sends cage/Quickshell output to the journal (`journalctl -t greeter`) instead of the VT.
command = "systemd-cat -t greeter env XCURSOR_THEME=Adwaita XCURSOR_SIZE=24 cage -s -d -- qs -p /usr/share/thomas-shell/greeter"
user = "greeter"
