# greetd config for this repo's greeter/.
# install.sh symlinks this to /etc/greetd/config.toml (prompting before
# replacing a pre-existing real file). Not read by Quickshell itself — greetd
# is what loads it. `-d` on cage disables client-side decorations so Qt doesn't
# draw a fallback titlebar around the greeter window.
[terminal]
vt = 1

[default_session]
# run.sh (generated by install/greeter.sh, not checked in) exports
# XCURSOR_THEME/SIZE before launching cage — avoids an unthemed white-square
# cursor while cage/Quickshell are still loading, without pinning this
# checked-in config to any specific theme.
command = "/etc/quickshell/greeter/run.sh"
user = "greeter"
